[project]
name = "football-predictor"
version = "0.1.0"
description = "NFL game prediction backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.5",
    "nflreadpy>=0.1.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
